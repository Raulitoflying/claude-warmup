name: Claude warm-up

on:
  schedule:
    # Weekdays, Vancouver during daylight saving time (PDT = UTC-7).
    # Shift +1 hour UTC during PST if exact local time matters.
    - cron: "0 13 * * 1-5" # 6:00 AM PDT
    - cron: "0 18 * * 1-5" # 11:00 AM PDT
    - cron: "0 23 * * 1-5" # 4:00 PM PDT
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_WARMUP_PROMPT: "Reply with exactly: OK."
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run Claude warm-up
        run: npm run warmup
